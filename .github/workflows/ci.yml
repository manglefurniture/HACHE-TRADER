name: HACHE-TRADER quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  paper-trading:
    name: Paper trading (no network or funds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python environment
        run: python3 --version

      - name: Validate release installer syntax
        run: bash -n deployment/install-telegram-paper.sh

      - name: Compile source and tests
        run: python3 -m compileall -q hache_trader tests

      - name: Run offline regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Verify live mode stays unavailable
        run: |
          python3 - <<'PY'
          from hache_trader.domain import GuardError, LiveExecutor, Policy
          try:
              Policy(mode="real")
              raise SystemExit("Live policy unexpectedly enabled")
          except GuardError:
              pass
          for method in ("submit", "cancel", "withdraw"):
              try:
                  getattr(LiveExecutor(), method)()
                  raise SystemExit("Real operation unexpectedly enabled: " + method)
              except GuardError:
                  pass
          print("LIVE_MODE_DISABLED=true")
          PY
